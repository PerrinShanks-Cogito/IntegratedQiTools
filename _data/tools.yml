# Tools in this app. Order here is the order on the landing page and in the
# "QI charting tools" menu. `id` must match the tool's folder name.
- id: process_map
  name: Process map
  status: Beta
  group: Understand the system
  description: Map each step of a process, mark waits and handoffs, and see where time and effort are lost before you redesign it.

- id: driver_diagram
  name: Driver diagram
  status: Beta
  group: Understand the system
  description: Link your aim to the primary and secondary drivers that influence it, and the change ideas you plan to test.

- id: fishbone_diagram
  name: Fishbone diagram
  status: Beta
  group: Understand the system
  description: Map the causes behind a problem as a cause and effect (Ishikawa) diagram, grouped into categories such as People, Methods and Equipment.

- id: pareto_chart
  name: Pareto chart
  status: Beta
  group: Prioritise
  description: Rank causes or categories by how often they occur so you can focus on the vital few that make the biggest difference.

- id: matrix_2x2
  name: 2x2 matrix
  status: Beta
  group: Prioritise
  description: Score items on two measures and see them in four groups, such as change ideas by ease and impact, stakeholders by influence and interest, or risks by likelihood and consequence, with a data sheet for your team to score them in.

- id: tree_plot
  name: Tree plot
  status: Beta
  group: Prioritise
  description: See how a total breaks down into groups and the items within them, such as incidents by directorate, ward and type, with each box sized by its share and a data sheet to collect your data in.

- id: bar_chart
  name: Bar chart
  status: Beta
  group: Prioritise
  description: Compare counts or values across categories, such as wards, teams or reasons, side by side.

- id: run_chart
  name: Run chart
  status: Beta
  group: Measure over time
  description: Plot data over time and check it against the four run chart rules to spot shifts, trends and non-random patterns.

- id: spc_tool
  name: SPC chart
  status: Beta
  group: Measure over time
  description: Build statistical process control charts with process limits to tell common cause from special cause variation. An XmR chart for a value each week or month, a P chart for a count out of a total, a U chart for a rate such as falls per 1,000 bed days, a C chart for a count, or a T chart for the dates of rare events.

- id: histogram
  name: Histogram
  status: Beta
  group: Explore your data
  description: See the shape and spread of a set of measurements, such as waiting times or length of stay.

- id: box_plot
  name: Box and whisker plot
  status: Beta
  group: Explore your data
  description: Compare the middle, spread and unusual values of a measure across groups, such as waiting times by site or length of stay by ward.

- id: anova
  name: ANOVA
  status: Beta
  group: Explore your data
  description: Test whether the averages of several groups really differ, such as length of stay across wards, and see which groups stand apart.

- id: chi_squared
  name: Chi-squared test
  status: Beta
  group: Explore your data
  description: Test whether counts split differently between groups, such as patients assessed on time or late on each ward, or differ from the split you expected.

- id: funnel_plot
  name: Funnel plot
  status: Beta
  group: Explore your data
  description: Compare a rate across populations of different sizes, such as falls on each ward or referrals from each GP practice, and see which stand out once size is taken into account.

- id: scatter_plot
  name: Scatter plot
  status: Beta
  group: Explore your data
  description: Plot pairs of values to see whether two measures are related, and how strongly.

- id: multiple_regression
  name: Multiple regression
  status: Beta
  group: Explore your data
  description: See how several factors together relate to one result, such as staffing and demand against waiting times, and which of them matter most.

- id: weibull_reliability
  name: Weibull reliability analysis
  status: Beta
  group: Explore your data
  description: See how long things last before they fail, such as equipment until its first repair, how likely they are to keep working over time, and whether failures come early, at random or from wearing out.

- id: qualitative_analysis
  name: Qualitative survey analysis
  status: Alpha
  group: Explore your data
  description: Make sense of free-text survey comments. Check how rich they are, explore them with a word cloud, code each response with your own codes and sentiment, and write up findings with quotes, judged by their impact rather than how many said it, with a data sheet to code responses in.

- id: gauge_rr
  name: Gauge R&R
  status: Beta
  group: Test changes
  description: Check whether a measurement can be trusted, such as blood pressure readings or wound sizes, by seeing how much of its variation comes from the person and the equipment rather than from real differences, with a data sheet to record the study in.

- id: attribute_agreement
  name: Attribute agreement analysis
  status: Beta
  group: Test changes
  description: Check whether people rating the same cases, such as pressure ulcer categories or triage levels, agree with themselves, each other and an expert standard, with a data sheet to record the study in.

- id: design_of_experiments
  name: Design of experiments
  status: Beta
  group: Test changes
  description: Plan an experiment that tests two to four changes at once, such as staffing, streaming and self check-in, and see which of them, alone or together, really change the result.

- id: hypothesis_test_selector
  name: Hypothesis test selector
  status: Beta
  group: Test changes
  description: Answer a few questions about your data, such as whether your result is a count or a measurement and how many groups you are comparing, find the hypothesis test to use, then paste your data to run it.

- id: power_sample_size
  name: Power and sample size
  status: Beta
  group: Test changes
  description: Work out how many patients or measurements you need before you test a change, how likely your test is to detect a real improvement, or the smallest change your sample can pick up.

- id: demand_capacity
  name: Demand and capacity model
  status: Beta
  group: Plan capacity
  description: Compare the capacity your service needs with what it has, and see the waiting list you can sustain, using the NHS demand and capacity core model.
